<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王大力 · BGM 生成器</title>
<style>
  :root { --bg:#1c1814; --panel:#2a241e; --line:#4a3c30; --text:#f2e5d5; --muted:#b9a58e; --accent:#e08a4a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Microsoft YaHei",system-ui,sans-serif; }
  main { max-width:980px; margin:0 auto; padding:32px 20px 60px; }
  h1 { margin:0 0 8px; font-size:26px; }
  p { color:var(--muted); line-height:1.7; }
  .bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:18px 0 22px; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 14px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#1b120c; font-weight:700; }
  input[type=range] { accent-color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card h2 { margin:0 0 4px; font-size:16px; }
  .card small { color:var(--muted); }
  .card .actions { display:flex; gap:8px; margin-top:12px; }
  .card .actions button { padding:6px 10px; font-size:12px; }
  #status { color:var(--accent); font-size:13px; min-height:20px; margin-top:14px; }
  @media (max-width:680px){ .grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<main>
  <h1>王大力 · 舒缓 BGM 生成器</h1>
  <p>纯 HTML + Web Audio API 生成，无外部音频、无版权素材。每个音轨 30 秒可循环；可试听或导出 WAV，供桌面弹窗缓存播放。</p>

  <div class="bar">
    <button class="primary" id="stop">停止播放</button>
    <button id="exportAll">导出全部 WAV</button>
    <label>音量 <input id="vol" type="range" min="0" max="1" step="0.05" value="0.35"></label>
    <span id="status"></span>
  </div>

  <div class="grid" id="grid"></div>
</main>

<script>
const SR = 44100, DUR = 30;
const tracks = [
  { kind:'music1', name:'纯音乐 · 晨光', desc:'C 大调、暖垫、慢呼吸' },
  { kind:'music2', name:'纯音乐 · 微澜', desc:'D 大调、柔和泛音' },
  { kind:'music3', name:'纯音乐 · 归途', desc:'F 大调、低频包裹' },
  { kind:'rain',   name:'自然 · 雨声', desc:'细雨 + 水滴 + 低频' },
  { kind:'waves',  name:'自然 · 海浪', desc:'慢速潮汐、布朗噪声' },
  { kind:'stream', name:'自然 · 溪流', desc:'高频水声 + 气泡' },
  { kind:'birds',  name:'自然 · 清晨山林', desc:'鸟鸣 + 森林底噪' },
];

let ctx = null, source = null, current = null;
const vol = document.getElementById('vol');
const statusEl = document.getElementById('status');

function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

function randomSeed() {
  if (window.crypto && crypto.getRandomValues) {
    const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0];
  }
  return (Math.random() * 0xFFFFFFFF) >>> 0;
}

function synth(kind, n, sr = SR, seed = randomSeed()) {
  const out = new Float32Array(n);
  const r = rng(seed);
  if (kind.startsWith('music')) music(out, sr, r);
  else if (kind === 'rain') rain(out, sr, r);
  else if (kind === 'waves') waves(out, sr, r);
  else if (kind === 'stream') stream(out, sr, r);
  else if (kind === 'birds') birds(out, sr, r);
  const fade = sr * 2;
  for (let i=0;i<n;i++) {
    let f = 1;
    if (i < fade) f = i / fade;
    if (i > n - fade) f = Math.min(f, (n - i) / fade);
    out[i] *= Math.max(0, Math.min(1, f));
  }
  let peak = 1e-4;
  for (let i=0;i<n;i++) peak = Math.max(peak, Math.abs(out[i]));
  const g = 0.82 / peak;
  for (let i=0;i<n;i++) out[i] = Math.max(-1, Math.min(1, out[i] * g));
  return out;
}

function music(out, sr, r) {
  const roots = [130.81, 146.83, 155.56, 174.61, 196.00, 207.65, 233.08];
  const progressions = [
    [0, 9, 5, 7], [0, 5, 9, 7], [0, 3, 7, 10], [0, 7, 5, 9],
    [0, 5, 7, 9], [0, 9, 7, 5]
  ];
  const root = roots[Math.floor(r() * roots.length)];
  const prog = progressions[Math.floor(r() * progressions.length)];
  const bars = 4;
  const barN = Math.floor(out.length / bars);
  const triads = [];
  for (let b = 0; b < bars; b++) {
    const semi = prog[b % prog.length];
    const f = root * Math.pow(2, semi / 12);
    const minor = r() < 0.35;
    triads.push([f, f * Math.pow(2, (minor ? 3 : 4) / 12), f * Math.pow(2, 7 / 12)]);
  }

  // 随机琶音/铃音：每次生成都不同
  const notes = [];
  for (let b = 0; b < bars; b++) {
    const count = 3 + Math.floor(r() * 4);
    for (let k = 0; k < count; k++) {
      const triad = triads[b];
      const f = triad[Math.floor(r() * triad.length)] * (r() < 0.2 ? 2 : 1);
      const start = b * barN + Math.floor(r() * barN);
      const dur = Math.floor(sr * (0.25 + r() * 0.7));
      notes.push({ start, dur, f, amp: 0.035 + r() * 0.035, bell: r() < 0.35 });
    }
  }

  for (let i = 0; i < out.length; i++) {
    const t = i / sr;
    const b = Math.min(bars - 1, Math.floor(i / barN));
    const local = (i % barN) / sr;
    const barDur = barN / sr;
    let env = Math.min(1, local / 0.8) * Math.min(1, (barDur - local) / 0.8);
    env = Math.max(0, env);
    let s = 0;
    const triad = triads[b];
    for (let k = 0; k < triad.length; k++) {
      const lfo = 0.72 + 0.28 * Math.sin(2 * Math.PI * (0.03 + k * 0.008) * t + k + r() * 0.1);
      s += 0.09 * Math.sin(2 * Math.PI * triad[k] * t + 0.2 * Math.sin(2 * Math.PI * 0.05 * t)) * lfo * env;
    }
    s += 0.055 * Math.sin(2 * Math.PI * (root / 2) * t) * env;
    for (const n of notes) {
      if (i >= n.start && i < n.start + n.dur) {
        const p = (i - n.start) / n.dur;
        const e = Math.sin(Math.PI * p);
        const f = n.bell ? n.f * 2 : n.f;
        s += n.amp * Math.sin(2 * Math.PI * f * (i - n.start) / sr) * e;
      }
    }
    out[i] = s;
  }
}

function rain(out, sr, r) {
  let lp = 0, drop = 0;
  for (let i=0;i<out.length;i++) {
    const t = i / sr;
    const w = r()*2-1;
    lp += 0.11*(w-lp);
    let s = lp*0.55;
    if (r() < 0.00055) drop = 0.6;
    drop *= 0.994;
    s += drop*0.28*Math.sin(2*Math.PI*(900+700*Math.sin(t*3))*t);
    s += 0.015*Math.sin(2*Math.PI*55*t);
    out[i] = s;
  }
}

function waves(out, sr, r) {
  let brown = 0;
  for (let i=0;i<out.length;i++) {
    const t = i / sr;
    const w = r()*2-1;
    brown = (brown + 0.02*w) / 1.02;
    const slow = 0.28 + 0.72*(0.5 + 0.5*Math.sin(2*Math.PI*0.075*t));
    out[i] = brown * 2.6 * slow;
  }
}

function stream(out, sr, r) {
  let lp = 0, bubble = 0;
  for (let i=0;i<out.length;i++) {
    const t = i / sr;
    const w = r()*2-1;
    lp += 0.18*(w-lp);
    const high = w - lp;
    let s = high*0.16;
    if (r() < 0.0012) bubble = 0.5;
    bubble *= 0.992;
    s += bubble*0.22*Math.sin(2*Math.PI*(450+500*Math.sin(t*7))*t);
    out[i] = s;
  }
}

function birds(out, sr, r) {
  let lp = 0, chirpT = 0, chirpF = 0;
  for (let i=0;i<out.length;i++) {
    const t = i / sr;
    const w = r()*2-1;
    lp += 0.04*(w-lp);
    let s = lp*0.35;
    if (chirpT <= 0 && r() < 0.0009) { chirpT = 0.22; chirpF = 2100 + Math.floor(r()*1400); }
    if (chirpT > 0) {
      const p = 1 - chirpT/0.22;
      s += 0.12*Math.sin(2*Math.PI*(chirpF+900*p)*t)*Math.sin(Math.PI*p);
      chirpT -= 1/sr;
    }
    out[i] = s;
  }
}

function wavBlob(samples, sr = SR) {
  const n = samples.length;
  const buf = new ArrayBuffer(44 + n*2);
  const v = new DataView(buf);
  const ws = (o,s) => { for (let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  ws(0,'RIFF'); v.setUint32(4, 36+n*2, true); ws(8,'WAVE');
  ws(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  ws(36,'data'); v.setUint32(40,n*2,true);
  for (let i=0;i<n;i++) {
    const x = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(44+i*2, x < 0 ? x*0x8000 : x*0x7FFF, true);
  }
  return new Blob([buf], { type:'audio/wav' });
}

async function render(kind, seed = randomSeed()) {
  const data = synth(kind, SR*DUR, SR, seed);
  return wavBlob(data);
}

async function play(kind) {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') await ctx.resume();
  if (source) { try { source.stop(); } catch {} source = null; }
  const seed = randomSeed();
  const data = synth(kind, Math.floor(ctx.sampleRate*DUR), ctx.sampleRate, seed);
  const buffer = ctx.createBuffer(1, data.length, ctx.sampleRate);
  buffer.copyToChannel(data, 0);
  source = ctx.createBufferSource();
  source.buffer = buffer;
  source.loop = true;
  const gain = ctx.createGain();
  gain.gain.value = Number(vol.value);
  source.connect(gain).connect(ctx.destination);
  source.start();
  current = kind;
  statusEl.textContent = '正在播放：' + (tracks.find(t=>t.kind===kind)?.name || kind) + ' · seed ' + seed;
}

async function download(kind) {
  const seed = randomSeed();
  statusEl.textContent = '生成中：' + kind + ' · seed ' + seed;
  const blob = await render(kind, seed);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = kind + '-' + seed + '.wav';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  statusEl.textContent = '已导出：' + a.download;
}

async function exportAll() {
  for (const t of tracks) await download(t.kind);
  statusEl.textContent = '全部导出完成';
}

function init() {
  const grid = document.getElementById('grid');
  for (const t of tracks) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2>${t.name}</h2><small>${t.desc}</small>
      <div class="actions"><button data-play="${t.kind}">播放</button>
      <button data-dl="${t.kind}">导出 WAV</button></div>`;
    grid.appendChild(card);
  }
  grid.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.play) play(b.dataset.play);
    if (b.dataset.dl) download(b.dataset.dl);
  });
  document.getElementById('stop').onclick = () => { if (source) { try{source.stop();}catch{} source=null; } statusEl.textContent='已停止'; };
  document.getElementById('exportAll').onclick = exportAll;
  vol.oninput = () => { if (source) source.context.resume(); };
}
init();
</script>
</body>
</html>
